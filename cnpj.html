<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta CNPJ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 7H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"/>
          <rect x="9" y="3" width="6" height="4" rx="1"/>
          <path d="M9 14h.01"/><path d="M13 14h2"/>
          <path d="M9 17h.01"/><path d="M13 17h2"/>
        </svg>
      </div>
      <span>CONSULTA HUB</span>
    </a>
    <div class="navbar-links">
      <a href="index.html" class="nav-link">Home</a>
      <a href="cpf.html" class="nav-link">CPF</a>
      <a href="cnpj.html" class="nav-link active">CNPJ</a>
      <a href="engine.html" class="nav-link">Engine</a>
    </div>
  </nav>

  <div class="container">

    <div class="header">
      <div class="header-logo">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 7H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"/>
            <rect x="9" y="3" width="6" height="4" rx="1"/>
            <path d="M9 14h.01"/><path d="M13 14h2"/>
            <path d="M9 17h.01"/><path d="M13 17h2"/>
          </svg>
        </div>
        <h1>Consulta CNPJ</h1>
      </div>
      <p>Consulte dados completos de empresas pelo CNPJ</p>
    </div>

    <div class="search-box">
      <div class="input-wrapper">
        <input
          type="text"
          id="cnpjInput"
          placeholder="00.000.000/0001-00"
          maxlength="18"
          autocomplete="off"
          spellcheck="false"
        />
        <span class="input-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.3-4.3"/>
          </svg>
        </span>
      </div>
      <button class="btn-primary" id="btnConsultar" onclick="consultar()">Consultar</button>
    </div>

    <div id="loading" class="spinner-wrapper hidden">
      <div class="spinner"></div>
      <p>Consultando dados da empresa...</p>
    </div>

    <div id="erro" class="error-msg hidden"></div>

    <div id="resultado" class="glass-card hidden" style="animation: cardReveal 0.5s cubic-bezier(0.16,1,0.3,1);"></div>

  </div>

  <footer class="footer">
    Dados obtidos via <a href="https://publica.cnpj.ws" target="_blank" rel="noopener">cnpj.ws</a>
  </footer>

  <script src="script-cnpj.js"></script>

</body>
</html>
