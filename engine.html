<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPF Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 7H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"/>
          <rect x="9" y="3" width="6" height="4" rx="1"/>
          <path d="M9 14h.01"/><path d="M13 14h2"/>
          <path d="M9 17h.01"/><path d="M13 17h2"/>
        </svg>
      </div>
      <span>CONSULTA HUB</span>
    </a>
    <div class="navbar-links">
      <a href="index.html" class="nav-link">Home</a>
      <a href="cpf.html" class="nav-link">CPF</a>
      <a href="cnpj.html" class="nav-link">CNPJ</a>
      <a href="engine.html" class="nav-link active">Engine</a>
    </div>
  </nav>

  <div class="container">

    <div class="header">
      <div class="header-logo">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 17 10 11 4 5"/>
            <line x1="12" y1="19" x2="20" y2="19"/>
          </svg>
        </div>
        <h1>CPF ENGINE</h1>
      </div>
      <p>gere todos os CPFs válidos a partir de um padrão com curingas</p>
    </div>

    <div class="search-box">
      <div class="input-wrapper">
        <input
          id="cpfInput"
          placeholder="???????????"
          maxlength="11"
          autocomplete="off"
          spellcheck="false"
        >
        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <button class="btn-primary" onclick="start()">START</button>
    </div>

    <p class="input-hint">11 caracteres — use <span>?</span> como curinga &nbsp;|&nbsp; ex: <span>123??????45</span></p>

    <div id="info" class="info-bar"></div>

    <div class="glass-card">
      <div class="card-inner">
        <div id="res" class="engine-res"></div>

        <div class="export-controls" id="exportControls">
          <button class="btn-secondary" onclick="copiarTodos()" id="btnCopiar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            COPIAR TODOS
          </button>
          <button class="btn-secondary" onclick="baixarTxt()" id="btnBaixar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            BAIXAR .TXT
          </button>
          <span id="exportMsg"></span>
        </div>
      </div>
    </div>

  </div>

  <footer class="footer">CPF Engine — Hub Desenvolvedor</footer>

  <script src="script-engine.js"></script>

</body>
</html>
